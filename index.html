<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Karate Bedtime Runner</title>
  <style>
    html,body{
      height:100%;
      margin:0;
      background:linear-gradient(180deg, #1a1a2e 0%, #0f0f1e 100%);
      color:#dfe9ff;
      font-family:monospace;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
    }
    #game-container{
      border:3px solid #4a5568;
      box-shadow:0 0 30px rgba(138, 211, 255, 0.3);
      border-radius:8px;
      overflow:hidden;
    }
    .topbar{
      text-align:center;
      padding:20px;
      color:#8ad3ff;
      font-size:18px;
      font-weight:bold;
      text-shadow:0 0 10px #4a7fff;
    }
    .hint{
      text-align:center;
      color:#9fbfff;
      font-size:13px;
      margin-top:15px;
      max-width:600px;
      padding:0 20px;
    }
    .controls{
      display:flex;
      gap:20px;
      margin-top:15px;
    }
    .btn{
      background:#6e2f8b;
      color:#fff;
      border:none;
      padding:12px 24px;
      font-size:14px;
      border-radius:8px;
      cursor:pointer;
      font-family:monospace;
      font-weight:bold;
      transition:all 0.2s;
    }
    .btn:hover{
      background:#8b3fa8;
      transform:translateY(-2px);
      box-shadow:0 4px 12px rgba(110, 47, 139, 0.4);
    }
    .btn:active{
      transform:translateY(0);
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
</head>
<body>
  <div class="topbar">🥋 Karate Bedtime Runner 🛏️</div>
  <div id="game-container"></div>
  <div class="hint">
    SPACE or UP arrow to jump • Dodge the shurikens • Reach the bed to rest! 💤
    <br>
    <span style="color:#ffd700">Each meter closer to bed = More encouraging messages! ✨</span>
  </div>
  <div class="controls">
    <button class="btn" onclick="location.reload()">🔄 New Game</button>
  </div>

<script>
const CONFIG = {
  width: 800,
  height: 400,
  gravity: 1200,
  jumpForce: -500,
  gameSpeed: 250,
  distanceToBed: 500, // meters to reach bed
  messages: [
    // Early messages (0-100m)
    ["Keep going! 💪", "You've got this!", "One step at a time", "Don't give up!"],
    // Mid messages (100-250m)
    ["Halfway there! 🌟", "You're doing amazing!", "Almost there!", "Keep pushing!"],
    // Late messages (250-400m)
    ["So close now! 😴", "The bed is near!", "Rest is coming!", "Final stretch!"],
    // Near end (400-500m)
    ["You can see it! 🛏️", "Just a bit more!", "You deserve this!", "Almost done!"]
  ],
  endMessages: [
    "You've done enough today 🌙",
    "Rest is productive too ✨",
    "You deserve this rest 😴",
    "Progress, not perfection 💙",
    "Sleep is a superpower 💤",
    "You're stronger than you know",
    "Tomorrow is a new start ☀️",
    "Be proud of what you did today",
    "Small victories matter too",
    "Recharge your batteries 🔋"
  ]
};

let player, ground, obstacles = [], distance = 0, gameOver = false;
let distanceText, messageText, lastMessageDist = 0, gameScene;
let jumpKey, spaceKey, canJump = true, bgLayer1, bgLayer2;

class GameScene extends Phaser.Scene {
  constructor() {
    super('GameScene');
  }

  create() {
    gameScene = this;
    
    // Parallax background stars
    bgLayer1 = this.add.graphics();
    bgLayer2 = this.add.graphics();
    this.createStars(bgLayer1, 30);
    this.createStars(bgLayer2, 20);
    
    // Ground
    ground = this.add.graphics();
    ground.fillStyle(0x2f3035);
    ground.fillRect(0, CONFIG.height - 60, CONFIG.width, 60);
    ground.fillStyle(0x3b3c44);
    ground.fillRect(0, CONFIG.height - 58, CONFIG.width, 3);
    
    // Create player (karate girl)
    player = this.createKarateGirl(100, CONFIG.height - 110);
    player.velocityY = 0;
    player.isJumping = false;
    player.groundY = CONFIG.height - 110;
    
    // Distance marker (bed icon in distance)
    this.createBedMarker();
    
    // UI
    distanceText = this.add.text(20, 20, 'Distance: 0m / 500m', {
      font: '18px monospace',
      fill: '#ffd700',
      stroke: '#000',
      strokeThickness: 4
    });
    
    messageText = this.add.text(CONFIG.width / 2, 80, 'Reach the bed! 🛏️', {
      font: '16px monospace',
      fill: '#8ad3ff',
      align: 'center'
    }).setOrigin(0.5);
    
    // Controls
    jumpKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.UP);
    spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
    
    // Touch/Click to jump
    this.input.on('pointerdown', () => {
      if(!gameOver && canJump && !player.isJumping) this.jump();
    });
    
    // Spawn obstacles
    this.time.addEvent({
      delay: 1500,
      callback: () => {
        if(!gameOver && distance < CONFIG.distanceToBed) {
          this.spawnShuriken();
        }
      },
      loop: true
    });
    
    // Show initial message
    this.showMessage('Go! Dodge the shurikens! 🥋');
  }

  update() {
    if(gameOver) return;
    
    // Jump input
    if((Phaser.Input.Keyboard.JustDown(jumpKey) || Phaser.Input.Keyboard.JustDown(spaceKey)) && canJump && !player.isJumping) {
      this.jump();
    }
    
    // Apply gravity
    if(player.isJumping) {
      player.velocityY += CONFIG.gravity * (this.game.loop.delta / 1000);
      player.y += player.velocityY * (this.game.loop.delta / 1000);
      
      // Land
      if(player.y >= player.groundY) {
        player.y = player.groundY;
        player.velocityY = 0;
        player.isJumping = false;
        canJump = true;
      }
    }
    
    // Parallax scrolling
    bgLayer1.x -= 0.5;
    bgLayer2.x -= 0.3;
    if(bgLayer1.x < -CONFIG.width) bgLayer1.x = 0;
    if(bgLayer2.x < -CONFIG.width) bgLayer2.x = 0;
    
    // Move obstacles
    obstacles.forEach(obs => {
      obs.x -= CONFIG.gameSpeed * (this.game.loop.delta / 1000);
      obs.sprite.setPosition(obs.x, obs.y);
      
      // Collision detection
      if(!gameOver && this.checkCollision(player, obs)) {
        this.hitObstacle();
      }
      
      // Remove off-screen obstacles
      if(obs.x < -50) {
        obs.sprite.destroy();
        obstacles = obstacles.filter(o => o !== obs);
      }
    });
    
    // Update distance
    if(distance < CONFIG.distanceToBed) {
      distance += CONFIG.gameSpeed * (this.game.loop.delta / 1000) / 10;
      distanceText.setText(`Distance: ${Math.floor(distance)}m / ${CONFIG.distanceToBed}m`);
      
      // Show encouraging messages
      if(Math.floor(distance) % 50 === 0 && Math.floor(distance) !== lastMessageDist && distance > 0) {
        lastMessageDist = Math.floor(distance);
        this.showEncouragingMessage();
      }
      
      // Check if reached bed
      if(distance >= CONFIG.distanceToBed) {
        this.reachBed();
      }
    }
  }

  createKarateGirl(x, y) {
    const g = this.add.graphics();
    
    // Head (skin tone)
    g.fillStyle(0xffd6a5);
    g.fillRect(5, 0, 14, 14);
    
    // Hair (ponytail)
    g.fillStyle(0x2b1b17);
    g.fillRect(3, 0, 8, 10);
    g.fillRect(0, 5, 5, 3); // ponytail
    
    // Eyes
    g.fillStyle(0x000000);
    g.fillRect(8, 5, 2, 2);
    g.fillRect(13, 5, 2, 2);
    
    // Karate gi (white top)
    g.fillStyle(0xffffff);
    g.fillRect(3, 14, 18, 12);
    
    // Belt (black)
    g.fillStyle(0x000000);
    g.fillRect(3, 20, 18, 3);
    
    // Pants (white)
    g.fillStyle(0xf0f0f0);
    g.fillRect(5, 26, 7, 12);
    g.fillRect(12, 26, 7, 12);
    
    // Feet
    g.fillStyle(0xffd6a5);
    g.fillRect(5, 38, 6, 4);
    g.fillRect(13, 38, 6, 4);
    
    g.setPosition(x, y);
    g.setDepth(10);
    
    return g;
  }

  createStars(layer, count) {
    for(let i = 0; i < count; i++) {
      const x = Math.random() * CONFIG.width * 2;
      const y = Math.random() * (CONFIG.height - 100);
      const size = Math.random() * 2 + 1;
      layer.fillStyle(0xffffff, Math.random() * 0.5 + 0.3);
      layer.fillCircle(x, y, size);
    }
  }

  createBedMarker() {
    const marker = this.add.graphics();
    marker.fillStyle(0x8ad3ff, 0.5);
    marker.fillRect(0, 0, 40, 25);
    marker.fillStyle(0xffffff, 0.7);
    marker.fillRect(0, 0, 35, 10);
    marker.fillStyle(0xffd6a5, 0.5);
    marker.fillRect(28, 8, 8, 8);
    marker.setPosition(CONFIG.width - 60, CONFIG.height - 200);
    marker.setDepth(1);
    
    this.tweens.add({
      targets: marker,
      alpha: 0.3,
      duration: 1000,
      yoyo: true,
      repeat: -1
    });
  }

  createShuriken(x, y) {
    const g = this.add.graphics();
    
    // 4-pointed shuriken
    g.fillStyle(0x666666);
    g.fillRect(6, 0, 4, 16);
    g.fillRect(0, 6, 16, 4);
    
    // Center circle
    g.fillStyle(0x888888);
    g.fillCircle(8, 8, 3);
    
    g.setPosition(x, y);
    g.setDepth(9);
    
    // Spin animation
    this.tweens.add({
      targets: g,
      angle: 360,
      duration: 1000,
      repeat: -1
    });
    
    return g;
  }

  spawnShuriken() {
    const height = Phaser.Math.Between(0, 2);
    let y;
    
    if(height === 0) y = CONFIG.height - 100; // Ground level
    else if(height === 1) y = CONFIG.height - 150; // Mid jump
    else y = CONFIG.height - 200; // High jump
    
    const sprite = this.createShuriken(CONFIG.width + 20, y);
    obstacles.push({
      sprite: sprite,
      x: CONFIG.width + 20,
      y: y,
      width: 16,
      height: 16
    });
  }

  jump() {
    if(!player.isJumping) {
      player.isJumping = true;
      player.velocityY = CONFIG.jumpForce;
      canJump = false;
      
      // Jump animation
      this.tweens.add({
        targets: player,
        angle: 360,
        duration: 600,
        ease: 'Linear'
      });
    }
  }

  checkCollision(player, obs) {
    const px = player.x;
    const py = player.y;
    const pw = 24;
    const ph = 42;
    
    return (px + pw > obs.x && 
            px < obs.x + obs.width &&
            py + ph > obs.y &&
            py < obs.y + obs.height);
  }

  hitObstacle() {
    gameOver = true;
    
    // Flash red
    this.cameras.main.flash(500, 255, 0, 0);
    this.cameras.main.shake(300, 0.02);
    
    // Stop player animation
    this.tweens.killTweensOf(player);
    player.setAlpha(0.5);
    
    // Show game over message
    const gameOverText = this.add.text(CONFIG.width / 2, CONFIG.height / 2 - 50, '💥 Hit! 💥', {
      font: 'bold 36px monospace',
      fill: '#ff6b6b',
      stroke: '#000',
      strokeThickness: 6
    }).setOrigin(0.5);
    
    const distanceReached = this.add.text(CONFIG.width / 2, CONFIG.height / 2, `You made it ${Math.floor(distance)}m`, {
      font: '20px monospace',
      fill: '#ffd700',
      stroke: '#000',
      strokeThickness: 4
    }).setOrigin(0.5);
    
    const retryText = this.add.text(CONFIG.width / 2, CONFIG.height / 2 + 50, 'Click "New Game" to try again!', {
      font: '16px monospace',
      fill: '#8ad3ff'
    }).setOrigin(0.5);
    
    // Fade in
    gameOverText.setAlpha(0);
    distanceReached.setAlpha(0);
    retryText.setAlpha(0);
    
    this.tweens.add({
      targets: [gameOverText, distanceReached, retryText],
      alpha: 1,
      duration: 500,
      delay: 300
    });
  }

  reachBed() {
    gameOver = true;
    
    // Victory flash
    this.cameras.main.flash(1000, 138, 211, 255);
    
    // Stop obstacles
    obstacles.forEach(obs => obs.sprite.destroy());
    obstacles = [];
    
    // Victory message
    const victoryText = this.add.text(CONFIG.width / 2, CONFIG.height / 2 - 80, '🛏️ You Made It! 🛏️', {
      font: 'bold 40px monospace',
      fill: '#8ad3ff',
      stroke: '#000',
      strokeThickness: 6
    }).setOrigin(0.5);
    
    const encouragement = Phaser.Math.RND.pick(CONFIG.endMessages);
    const msgText = this.add.text(CONFIG.width / 2, CONFIG.height / 2 - 20, encouragement, {
      font: '18px monospace',
      fill: '#ffd700',
      stroke: '#000',
      strokeThickness: 4,
      align: 'center',
      wordWrap: { width: 600 }
    }).setOrigin(0.5);
    
    const restText = this.add.text(CONFIG.width / 2, CONFIG.height / 2 + 30, '😴 Time to rest 😴', {
      font: '24px monospace',
      fill: '#ffffff'
    }).setOrigin(0.5);
    
    const scoreText = this.add.text(CONFIG.width / 2, CONFIG.height / 2 + 70, `Perfect run: ${CONFIG.distanceToBed}m! 🌟`, {
      font: '16px monospace',
      fill: '#00ff88'
    }).setOrigin(0.5);
    
    // Fade in
    [victoryText, msgText, restText, scoreText].forEach(t => t.setAlpha(0));
    
    this.tweens.add({
      targets: [victoryText, msgText, restText, scoreText],
      alpha: 1,
      duration: 800,
      delay: 500
    });
    
    // Confetti
    this.createConfetti();
  }

  createConfetti() {
    for(let i = 0; i < 50; i++) {
      const x = Math.random() * CONFIG.width;
      const y = -20;
      const color = Phaser.Math.RND.pick([0xff6b6b, 0xffd700, 0x8ad3ff, 0x00ff88]);
      
      const confetti = this.add.graphics();
      confetti.fillStyle(color);
      confetti.fillRect(0, 0, 8, 8);
      confetti.setPosition(x, y);
      confetti.setDepth(100);
      
      this.tweens.add({
        targets: confetti,
        y: CONFIG.height + 50,
        x: x + (Math.random() - 0.5) * 200,
        angle: Math.random() * 720,
        duration: 3000 + Math.random() * 2000,
        ease: 'Cubic.easeOut',
        onComplete: () => confetti.destroy()
      });
    }
  }

  showMessage(text) {
    messageText.setText(text);
    messageText.setAlpha(1);
    
    this.tweens.add({
      targets: messageText,
      alpha: 0,
      duration: 2000,
      delay: 1500
    });
  }

  showEncouragingMessage() {
    let msgArray;
    if(distance < 100) msgArray = CONFIG.messages[0];
    else if(distance < 250) msgArray = CONFIG.messages[1];
    else if(distance < 400) msgArray = CONFIG.messages[2];
    else msgArray = CONFIG.messages[3];
    
    const msg = Phaser.Math.RND.pick(msgArray);
    this.showMessage(msg);
  }
}

const game = new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'game-container',
  width: CONFIG.width,
  height: CONFIG.height,
  backgroundColor: '#0f0f1e',
  scene: GameScene
});
</script>
</body>
</html>
